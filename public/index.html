<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Atlas - Qlik Wrapper</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: transparent; }
    body {
      width: 100%; height: 100vh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent; color: #333;
    }
    #container { width: 100%; height: 100%; position: relative; background: transparent; }
    canvas { background: transparent !important; }
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); text-align: center; color: #999;
      background: transparent;
    }
    .spinner {
      border: 4px solid #333; border-top: 4px solid #009845;
      border-radius: 50%; width: 50px; height: 50px;
      animation: spin 1s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .systems-panel {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.95); border-radius: 12px;
      padding: 0; width: 220px; max-height: calc(100vh - 80px);
      overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 1000;
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 15px; border-bottom: 1px solid #eee;
      background: rgba(255,255,255,0.98); border-radius: 12px 12px 0 0;
    }
    .panel-header h3 { font-size: 14px; font-weight: 600; }
    .system-list { padding: 8px 0; max-height: 300px; overflow-y: auto; }
    .system-row {
      display: flex; align-items: center; padding: 6px 12px;
      cursor: pointer; transition: background 0.2s; font-size: 12px;
    }
    .system-row:hover { background: #f0f0f0; }
    .system-row.disabled { opacity: 0.4; }
    .system-dot {
      width: 10px; height: 10px; border-radius: 50%;
      margin-right: 8px; flex-shrink: 0;
    }
    .system-toggle {
      width: 32px; height: 18px; background: #ddd; border-radius: 9px;
      position: relative; cursor: pointer; margin-left: auto;
    }
    .system-toggle.on { background: #009845; }
    .system-toggle::after {
      content: ''; position: absolute; width: 14px; height: 14px;
      background: white; border-radius: 50%; top: 2px; left: 2px;
      transition: transform 0.2s;
    }
    .system-toggle.on::after { transform: translateX(14px); }

    #info {
      position: absolute; top: 10px; right: 10px;
      z-index: 1000; display: flex; align-items: center; gap: 8px;
    }
    #pending-badge {
      background: rgba(0,152,69,0.9); color: white;
      padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
      display: none;
    }
    #select-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,152,69,0.9); color: white; border: none;
      cursor: pointer; font-size: 18px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); transition: all 0.2s;
    }
    #select-btn:hover { background: #007a38; transform: scale(1.1); }
    #select-btn:disabled { background: rgba(150,150,150,0.7); cursor: not-allowed; transform: none; }

    #view-mode-toolbar {
      position: absolute; top: 10px; left: 10px;
      z-index: 1000; display: flex; gap: 2px;
    }
    .view-mode-btn {
      padding: 6px 12px; border: none; border-radius: 0;
      font-size: 11px; font-weight: 600; cursor: pointer;
      background: rgba(100,100,100,0.7); color: white; transition: all 0.2s;
    }
    .view-mode-btn:hover { background: rgba(80,80,80,0.8); }
    .view-mode-btn.active { background: rgba(0,152,69,0.9); color: white; }
    .view-mode-btn.active:hover { background: rgba(0,122,56,0.9); }
    #attribution {
      position: absolute; bottom: 4px; left: 0; right: 0;
      text-align: center; font-size: 9px; color: rgba(100,100,100,0.7);
      z-index: 999; pointer-events: none;
    }
    #attribution a { color: rgba(80,80,80,0.8); text-decoration: none; }
    #attribution a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="container">
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading Human Atlas...</p>
    </div>

    <div class="systems-panel" id="systems-panel" style="display: none;">
      <div class="panel-header">
        <h3>Systems</h3>
        <span id="system-count-badge" style="font-size:11px;color:#666;">0</span>
      </div>
      <div class="system-list" id="system-list"></div>
    </div>

    <div id="view-mode-toolbar" style="display: none;">
      <button class="view-mode-btn active" data-mode="ghost" title="Show ghost outline of non-selected parts">Ghost</button>
      <button class="view-mode-btn" data-mode="isolate" title="Show only selected parts">Isolate</button>
    </div>

    <div id="info" style="display: none;">
      <span id="pending-badge">0</span>
      <button id="select-btn" disabled title="Apply selection">✓</button>
    </div>
    <span id="selectable-count" style="display:none;">0</span>

    <div id="attribution">
      Created by Jochem Zwienenberg, Qlik |
      <a href="https://lifesciencedb.jp/bp3d/" target="_blank" style="pointer-events: auto;">BodyParts3D</a>, © The Database Center for Life Science (CC BY 4.0) |
      <a href="https://github.com/ashemag/human-atlas" target="_blank" style="pointer-events: auto;">Human Atlas</a> © 2026 Ashe Magalhaes
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    console.log('Human Atlas Wrapper - Simplified Selection Mode');

    const SYSTEM_COLORS = {
      'skeleton': [226,217,186], 'skeletal': [226,217,186],
      'muscles': [168,91,80], 'muscular': [168,91,80],
      'heart': [185,103,96], 'cardiac': [185,103,96],
      'sensory organs': [176,200,206], 'sensory': [176,200,206],
      'arteries': [192,82,69], 'arterial': [192,82,69],
      'veins': [82,124,159], 'venous': [82,124,159],
      'nervous system': [216,181,101], 'nervous': [216,181,101],
      'respiratory': [185,137,145], 'digestive': [184,145,107],
      'urinary': [180,121,97], 'lymphatic': [135,159,124],
      'endocrine': [197,160,154], 'reproductive': [189,160,152],
      'body surface': [186,155,125], 'integumentary': [186,155,125],
      'connective tissue': [174,195,187], 'connective': [174,195,187]
    };

    // No explicit render order needed - rely on natural depth buffer like original project
    // Only integumentary needs special handling (transparent, no depth write)

    let SYSTEMS = {};
    let atlas = null, scene = null, camera = null, renderer = null, controls = null;
    let meshes = [], systemCounts = {};

    // Selection state
    let selectableParts = new Map();  // lowercase name -> {name, elemNumber, isSelected}
    let pendingSelection = new Set(); // Qlik part names user clicked (in memory)
    let qlikSelectedParts = new Set(); // parts currently selected in Qlik
    let meshToQlikName = new Map();   // atlas mesh name -> Qlik part name
    let viewMode = 'ghost';           // 'ghost' = show transparent outline, 'isolate' = hide non-selected
    let isFirstSelection = true;      // Track if this is the first selection (for animation)
    let animatingMeshes = new Set();  // Meshes currently animating

    const qlikAPI = {
      send: (type, data) => {
        if (window.parent !== window) {
          window.parent.postMessage({ source: 'human-atlas', type, data }, '*');
          console.log('📤 Sent:', type);
        }
      }
    };

    async function loadAtlas() {
      const response = await fetch('https://raw.githubusercontent.com/ashemag/human-atlas/master/public/models/atlas.json');
      atlas = await response.json();
      console.log('Atlas loaded:', atlas.parts.length, 'parts');

      const systemSet = new Set();
      atlas.parts.forEach(part => {
        if (part.system) systemSet.add(part.system);
      });

      const systemNames = Array.from(systemSet).sort();
      console.log('Systems found in atlas:', systemNames);

      systemNames.forEach(sysName => {
        const key = sysName.toLowerCase();
        const rgb = SYSTEM_COLORS[key] || [180,180,180];
        SYSTEMS[key] = {
          name: sysName.charAt(0).toUpperCase() + sysName.slice(1),
          color: (rgb[0] << 16) | (rgb[1] << 8) | rgb[2],
          colorRGB: rgb,
          enabled: true
        };
      });

      return atlas;
    }

    async function initScene() {
      document.getElementById('loading').innerHTML = '<div class="spinner"></div><p>Building 3D scene...</p>';

      const container = document.getElementById('container');
      scene = new THREE.Scene();
      scene.background = null; // Transparent background

      camera = new THREE.PerspectiveCamera(34, container.clientWidth / container.clientHeight, 0.01, 50);  // Better near/far balance
      camera.position.set(0, 0, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: false });
      renderer.sortObjects = true;  // Let Three.js handle depth sorting naturally
      renderer.setClearColor(0x000000, 0); // Transparent clear color
      renderer.domElement.style.background = 'transparent';
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      container.appendChild(renderer.domElement);

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0xa7acb2, 1.05);
      scene.add(hemiLight);
      const keyLight = new THREE.DirectionalLight(0xfffaf4, 2.3);
      keyLight.position.set(-2, 4, 3);
      scene.add(keyLight);

      await loadGeometry();
      buildSystemsPanel();
      setupEventListeners();
      updateVisibility();
      focusOnVisibleParts();

      document.getElementById('systems-panel').style.display = 'block';
      document.getElementById('info').style.display = 'block';
      document.getElementById('loading').style.display = 'none';

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      qlikAPI.send('ready', { parts: meshes.length });
    }

    async function loadGeometry() {
      // Collect all meshes first, grouped by system
      const meshesBySystem = new Map();

      for (let i = 0; i < atlas.chunks.length; i++) {
        const chunkUrl = `https://raw.githubusercontent.com/ashemag/human-atlas/master/public${atlas.chunks[i].url}`;
        document.getElementById('loading').innerHTML = `<div class="spinner"></div><p>Loading: ${Math.round((i+1)/atlas.chunks.length*100)}%</p>`;

        const response = await fetch(chunkUrl);
        const chunkBuffer = await response.arrayBuffer();
        const partsInChunk = atlas.parts.filter(p => p.chunk === i);

        partsInChunk.forEach(part => {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(chunkBuffer, part.positions, part.vertexCount * 3), 3));
          geometry.setAttribute('normal', new THREE.BufferAttribute(new Int16Array(chunkBuffer, part.normals, part.vertexCount * 3), 3, true));
          geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(chunkBuffer, part.indices, part.indexCount), 1));
          geometry.computeBoundingSphere();

          const systemKey = (part.system || 'skeleton').toLowerCase();
          const color = SYSTEMS[systemKey]?.color || 0xcccccc;
          const isIntegumentary = systemKey === 'integumentary' || systemKey === 'body surface';

          // Simple material - let natural depth buffer handle layering
          const material = new THREE.MeshStandardMaterial({
            color,
            metalness: 0.08,
            roughness: 0.53,
            side: THREE.DoubleSide,
            transparent: isIntegumentary,
            opacity: isIntegumentary ? 0.1 : 1,
            depthWrite: !isIntegumentary
          });

          const mesh = new THREE.Mesh(geometry, material);
          mesh.frustumCulled = false;
          mesh.userData = { partId: part.id, name: part.name, system: systemKey, originalColor: color };

          // Group by system instead of adding immediately
          if (!meshesBySystem.has(systemKey)) meshesBySystem.set(systemKey, []);
          meshesBySystem.get(systemKey).push(mesh);
          systemCounts[systemKey] = (systemCounts[systemKey] || 0) + 1;
        });
      }

      // Only skin needs special render order (renders last as transparent overlay)
      // All other systems use natural depth buffer sorting
      meshesBySystem.forEach((systemMeshes, systemKey) => {
        const isIntegumentary = systemKey === 'integumentary' || systemKey === 'body surface';
        systemMeshes.forEach(mesh => {
          mesh.renderOrder = isIntegumentary ? 100 : 0;
          scene.add(mesh);
          meshes.push(mesh);
        });
      });

      // Center model
      const box = new THREE.Box3();
      meshes.forEach(mesh => box.expandByObject(mesh));
      const center = box.getCenter(new THREE.Vector3());
      meshes.forEach(mesh => mesh.position.sub(center));
      const boxSize = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(boxSize.x, boxSize.y, boxSize.z);
      camera.position.set(0, 0, maxDim * 1.8);

      // Start all meshes in ghost mode (waiting for Qlik selection)
      meshes.forEach(mesh => {
        const isIntegumentary = mesh.userData.system === 'integumentary' || mesh.userData.system === 'body surface';
        if (isIntegumentary) {
          mesh.material.opacity = 0.1;
          mesh.material.transparent = true;
        } else {
          mesh.material.opacity = 0.08;
          mesh.material.transparent = true;
          mesh.material.depthWrite = false;
        }
        // Store original position for animation
        mesh.userData.originalPosition = mesh.position.clone();
      });

      // Click handler
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let mouseDownPos = { x: 0, y: 0 };
      let isDragging = false;

      renderer.domElement.addEventListener('mousedown', e => {
        mouseDownPos = { x: e.clientX, y: e.clientY };
        isDragging = false;
      });

      renderer.domElement.addEventListener('mousemove', e => {
        if (Math.abs(e.clientX - mouseDownPos.x) > 5 || Math.abs(e.clientY - mouseDownPos.y) > 5) {
          isDragging = true;
        }
      });

      renderer.domElement.addEventListener('click', e => {
        if (isDragging) return;

        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        // Only allow clicking on non-ghosted, non-skin meshes
        const clickableMeshes = meshes.filter(m => {
          if (!m.visible) return false;
          // Exclude skin/integumentary
          const sys = m.userData.system;
          if (sys === 'integumentary' || sys === 'body surface') return false;
          // Exclude ghosted meshes (opacity < 0.5)
          if (m.material.opacity < 0.5) return false;
          return true;
        });
        const intersects = raycaster.intersectObjects(clickableMeshes);

        if (intersects.length > 0) {
          const mesh = intersects[0].object;
          const meshName = mesh.userData.name;

          // Get the Qlik name for this mesh, or use mesh name as fallback
          const qlikName = meshToQlikName.get(meshName) || meshName;

          // Toggle in pending selection
          if (pendingSelection.has(qlikName)) {
            pendingSelection.delete(qlikName);
            console.log('Removed from pending:', qlikName, '(mesh:', meshName, ')');
          } else {
            pendingSelection.add(qlikName);
            console.log('Added to pending:', qlikName, '(mesh:', meshName, ')');
          }

          updateSelectionUI();
          applyHighlights();
        }
      });
    }

    function animateSelectedParts(selectedMeshes) {
      if (selectedMeshes.length === 0) return;

      const duration = 1500; // 1.5 seconds
      const startTime = Date.now();

      // Set initial state: scaled down and offset to top-right
      selectedMeshes.forEach(mesh => {
        mesh.userData.animStartPos = mesh.position.clone();
        mesh.userData.animStartScale = 0.1;
        mesh.position.x += 0.3;
        mesh.position.y += 0.3;
        mesh.scale.setScalar(0.1);
        mesh.material.opacity = 0;
        mesh.material.transparent = true;
        animatingMeshes.add(mesh);
      });

      function animateFrame() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Ease out cubic
        const ease = 1 - Math.pow(1 - progress, 3);

        selectedMeshes.forEach(mesh => {
          if (!mesh.userData.animStartPos) return;

          // Interpolate position back to original
          mesh.position.x = mesh.userData.animStartPos.x + 0.3 * (1 - ease);
          mesh.position.y = mesh.userData.animStartPos.y + 0.3 * (1 - ease);
          mesh.position.z = mesh.userData.animStartPos.z;

          // Interpolate scale
          mesh.scale.setScalar(0.1 + 0.9 * ease);

          // Fade in
          const isIntegumentary = mesh.userData.system === 'integumentary' || mesh.userData.system === 'body surface';
          mesh.material.opacity = isIntegumentary ? 0.1 : ease;
        });

        if (progress < 1) {
          requestAnimationFrame(animateFrame);
        } else {
          // Animation complete - restore full state
          selectedMeshes.forEach(mesh => {
            mesh.position.copy(mesh.userData.animStartPos);
            mesh.scale.setScalar(1);
            const isIntegumentary = mesh.userData.system === 'integumentary' || mesh.userData.system === 'body surface';
            mesh.material.opacity = isIntegumentary ? 0.1 : 1;
            mesh.material.transparent = isIntegumentary;
            mesh.material.depthWrite = !isIntegumentary;
            animatingMeshes.delete(mesh);
            delete mesh.userData.animStartPos;
          });
        }
      }

      requestAnimationFrame(animateFrame);
    }

    function buildSystemsPanel() {
      const listEl = document.getElementById('system-list');
      listEl.innerHTML = '';
      document.getElementById('system-count-badge').textContent = Object.keys(SYSTEMS).length;

      Object.entries(SYSTEMS).sort((a,b) => (systemCounts[b[0]]||0) - (systemCounts[a[0]]||0)).forEach(([key, sys]) => {
        if (!systemCounts[key]) return;
        const row = document.createElement('div');
        row.className = 'system-row';
        row.dataset.system = key;
        const rgb = sys.colorRGB;
        row.innerHTML = `
          <span class="system-dot" style="background:rgb(${rgb.join(',')})"></span>
          <span>${sys.name}</span>
          <div class="system-toggle ${sys.enabled ? 'on' : ''}" data-system="${key}"></div>
        `;
        row.querySelector('.system-toggle').addEventListener('click', e => {
          e.stopPropagation();
          SYSTEMS[key].enabled = !SYSTEMS[key].enabled;
          e.target.classList.toggle('on');
          updateVisibility();
        });
        listEl.appendChild(row);
      });
    }

    function updateVisibility() {
      const debugCounts = {};
      const hasQlikFilter = selectableParts.size > 0;

      meshes.forEach(mesh => {
        const meshName = mesh.userData.name;
        const systemKey = mesh.userData.system;
        const systemObj = SYSTEMS[systemKey];
        const systemEnabled = systemObj?.enabled ?? true;
        const hasMapping = meshToQlikName.has(meshName);

        // Visibility is ALWAYS controlled by System Panel toggles
        // Qlik filter controls HIGHLIGHTS and SELECTABILITY, not visibility
        mesh.visible = systemEnabled;

        if (!debugCounts[systemKey]) debugCounts[systemKey] = { visible: 0, hidden: 0, selectable: 0 };
        if (mesh.visible) {
          debugCounts[systemKey].visible++;
          if (hasMapping) debugCounts[systemKey].selectable++;
        } else {
          debugCounts[systemKey].hidden++;
        }
      });

      console.log('Visibility update:', debugCounts, 'hasQlikFilter:', hasQlikFilter, 'selectableParts:', selectableParts.size);
      applyHighlights();
    }

    function applyHighlights() {
      const hasQlikFilter = selectableParts.size > 0;
      const hasQlikSelection = qlikSelectedParts.size > 0;

      meshes.forEach(mesh => {
        const meshName = mesh.userData.name;
        const qlikName = meshToQlikName.get(meshName);
        const hasMapping = !!qlikName;
        // Check pending by both Qlik name and mesh name (for parts without mapping)
        const isInPending = (qlikName && pendingSelection.has(qlikName)) || pendingSelection.has(meshName);
        const isQlikSelected = qlikName && qlikSelectedParts.has(qlikName.toLowerCase());
        const systemKey = mesh.userData.system;
        const systemEnabled = SYSTEMS[systemKey]?.enabled ?? true;
        const isIntegumentary = systemKey === 'integumentary' || systemKey === 'body surface';

        // Integumentary (skin) always stays semi-transparent
        if (isIntegumentary) {
          mesh.visible = systemEnabled;
          mesh.material.emissive = new THREE.Color(0x000000);
          mesh.material.emissiveIntensity = 0;
          mesh.material.opacity = 0.1;
          mesh.material.transparent = true;
          mesh.material.depthWrite = false;
          return;
        }

        // When Qlik has parts selected, ghost everything except selected parts
        if (hasQlikSelection) {
          if (isInPending) {
            // User clicked this part in viewer - bright green, visible
            mesh.visible = systemEnabled;
            mesh.material.emissive = new THREE.Color(0x00ff00);
            mesh.material.emissiveIntensity = 0.4;
            mesh.material.opacity = 1;
            mesh.material.transparent = false;
            mesh.material.depthWrite = true;
            mesh.renderOrder = 10;
          } else if (isQlikSelected) {
            // Qlik has this part selected - visible, no highlight
            mesh.visible = systemEnabled;
            mesh.material.emissive = new THREE.Color(0x000000);
            mesh.material.emissiveIntensity = 0;
            mesh.material.opacity = 1;
            mesh.material.transparent = false;
            mesh.material.depthWrite = true;
            mesh.renderOrder = 10;
          } else {
            // Not selected - ghost or isolate based on viewMode
            if (viewMode === 'isolate') {
              // Isolate mode: hide non-selected parts completely
              mesh.visible = false;
            } else {
              // Ghost mode: show transparent outline
              mesh.visible = systemEnabled;
              mesh.material.emissive = new THREE.Color(0x000000);
              mesh.material.emissiveIntensity = 0;
              mesh.material.opacity = 0.05;
              mesh.material.transparent = true;
              mesh.material.depthWrite = false;
              mesh.renderOrder = 0;
            }
          }
        } else if (hasQlikFilter && hasMapping) {
          // No selection but filter active - subtle highlight for filterable parts
          mesh.visible = systemEnabled;
          mesh.material.emissive = new THREE.Color(0xffaa00);
          mesh.material.emissiveIntensity = 0.15;
          mesh.material.opacity = 1;
          mesh.material.transparent = false;
          mesh.material.depthWrite = true;
          mesh.renderOrder = 0;
        } else {
          // No filter, no selection - normal display
          mesh.visible = systemEnabled;
          mesh.material.emissive = new THREE.Color(0x000000);
          mesh.material.emissiveIntensity = 0;
          mesh.material.opacity = 1;
          mesh.material.transparent = false;
          mesh.material.depthWrite = true;
          mesh.renderOrder = 0;
        }
      });
    }

    function updateSelectionUI() {
      const selectBtn = document.getElementById('select-btn');
      const pendingBadge = document.getElementById('pending-badge');
      const viewToolbar = document.getElementById('view-mode-toolbar');

      selectBtn.disabled = pendingSelection.size === 0;

      if (pendingSelection.size > 0) {
        pendingBadge.textContent = pendingSelection.size;
        pendingBadge.style.display = 'block';
      } else {
        pendingBadge.style.display = 'none';
      }

      // Show view mode toolbar when there's a Qlik selection active
      if (qlikSelectedParts.size > 0) {
        viewToolbar.style.display = 'flex';
      } else {
        viewToolbar.style.display = 'none';
      }
    }

    function setupEventListeners() {
      // View mode toggle buttons
      document.querySelectorAll('.view-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          viewMode = btn.dataset.mode;
          document.querySelectorAll('.view-mode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyHighlights();
          console.log('View mode changed to:', viewMode);
        });
      });

      // Select button - send pending selection to Qlik
      document.getElementById('select-btn').addEventListener('click', () => {
        if (pendingSelection.size > 0) {
          const parts = Array.from(pendingSelection);
          console.log('═══════════════════════════════════════');
          console.log('📤 SENDING TO QLIK:', parts.length, 'parts');
          parts.forEach((p, i) => console.log(`   ${i+1}. "${p}"`));
          console.log('═══════════════════════════════════════');
          qlikAPI.send('applySelection', { parts });
        }
      });


      // Listen for Qlik messages
      window.addEventListener('message', event => {
        if (event.data?.source !== 'qlik') return;
        console.log('📥 From Qlik:', event.data.type);

        switch (event.data.type) {
          case 'showFullModel':
            // No filter active - show all parts based on system toggles
            selectableParts.clear();
            qlikSelectedParts.clear();
            pendingSelection.clear();
            meshToQlikName.clear();

            // Map all meshes to themselves (no Qlik filter)
            meshes.forEach(mesh => {
              const name = mesh.userData.name;
              meshToQlikName.set(name, name);
            });

            console.log('Showing full model:', meshes.length, 'parts');
            document.getElementById('selectable-count').textContent = 'All';

            // Show all based on system toggles
            meshes.forEach(mesh => {
              mesh.visible = SYSTEMS[mesh.userData.system]?.enabled ?? true;
              mesh.material.emissive = new THREE.Color(0x000000);
              mesh.material.emissiveIntensity = 0;
            });

            updateSelectionUI();
            focusOnVisibleParts();
            break;

          case 'setSelectableParts':
            // Qlik sends us the parts that are selectable (not excluded)
            selectableParts.clear();
            qlikSelectedParts.clear();
            pendingSelection.clear();
            meshToQlikName.clear();

            const parts = event.data.data.parts || [];
            const selected = event.data.data.selectedParts || [];

            console.log('═══════════════════════════════════════');
            console.log('📥 QLIK PARTS RECEIVED:', parts.length);
            if (parts.length > 0 && parts.length <= 10) {
              parts.forEach((p, i) => console.log(`   ${i+1}. "${p.name}"`));
            } else if (parts.length > 10) {
              parts.slice(0, 5).forEach((p, i) => console.log(`   ${i+1}. "${p.name}"`));
              console.log(`   ... and ${parts.length - 5} more`);
            }

            // Build mapping from Qlik parts to atlas meshes
            // Priority: match by code (partId) first, then by name
            let matchCount = 0;

            // Build lookup maps
            const qlikCodeMap = new Map();        // code -> qlik name (for code-based matching)
            const qlikNameMap = new Map();        // name lowercase -> qlik name (for name-based matching)

            parts.forEach(p => {
              const qlikName = p.name;
              const qlikCode = p.code;
              const qlikNameLower = qlikName.toLowerCase().trim();
              selectableParts.set(qlikNameLower, { ...p, originalName: qlikName });
              qlikNameMap.set(qlikNameLower, qlikName);
              if (qlikCode) {
                qlikCodeMap.set(qlikCode.toUpperCase(), qlikName);
              }
            });

            const hasCodeData = qlikCodeMap.size > 0;
            console.log('🔑 Code-based matching available:', hasCodeData, 'codes:', qlikCodeMap.size);

            // Match meshes: try code first (if available), then name
            meshes.forEach(mesh => {
              const meshName = mesh.userData.name;
              const meshPartId = mesh.userData.partId;
              const meshNameLower = meshName.toLowerCase().trim();

              // Try code match first (most reliable)
              if (hasCodeData && meshPartId && qlikCodeMap.has(meshPartId.toUpperCase())) {
                meshToQlikName.set(meshName, qlikCodeMap.get(meshPartId.toUpperCase()));
                matchCount++;
              } else if (qlikNameMap.has(meshNameLower)) {
                // Fall back to name match
                meshToQlikName.set(meshName, qlikNameMap.get(meshNameLower));
                matchCount++;
              }
            });

            console.log('🔍 Sample mesh partIds:', meshes.slice(0, 3).map(m => m.userData.partId));
            console.log('🔍 Sample Qlik codes:', Array.from(qlikCodeMap.keys()).slice(0, 3));

            console.log('📊 MATCHING RESULTS:');
            console.log(`   Qlik parts: ${parts.length}`);
            console.log(`   Atlas meshes: ${meshes.length}`);
            console.log(`   Matches found: ${matchCount}`);
            console.log(`   Unique meshes mapped: ${meshToQlikName.size}`);
            console.log('═══════════════════════════════════════');

            selected.forEach(name => {
              qlikSelectedParts.add(name.toLowerCase());
            });

            console.log('Received from Qlik:', selectableParts.size, 'selectable,', qlikSelectedParts.size, 'selected');
            console.log('Mesh to Qlik mappings:', meshToQlikName.size);

            document.getElementById('selectable-count').textContent = selectableParts.size;

            // Animate selected parts on first selection
            if (isFirstSelection && qlikSelectedParts.size > 0) {
              isFirstSelection = false;
              // Find meshes that are selected
              const selectedMeshes = meshes.filter(m => {
                const qlikName = meshToQlikName.get(m.userData.name);
                return qlikName && qlikSelectedParts.has(qlikName.toLowerCase());
              });
              console.log('🎬 Animating', selectedMeshes.length, 'selected parts');
              animateSelectedParts(selectedMeshes);
            }

            updateVisibility();
            updateSelectionUI();
            focusOnVisibleParts();
            break;

          case 'settings':
            const s = event.data.data;
            if (s.showSystemsPanel !== undefined) {
              document.getElementById('systems-panel').style.display = s.showSystemsPanel ? 'block' : 'none';
            }
            if (s.showInfoPanel !== undefined) {
              document.getElementById('info').style.display = s.showInfoPanel ? 'block' : 'none';
            }
            break;
        }
      });
    }

    function focusOnVisibleParts() {
      // Use requestAnimationFrame to ensure visibility changes are processed
      requestAnimationFrame(() => {
        // If Qlik has parts selected, focus only on those
        let focusMeshes;
        if (qlikSelectedParts.size > 0) {
          focusMeshes = meshes.filter(m => {
            const qlikName = meshToQlikName.get(m.userData.name);
            return qlikName && qlikSelectedParts.has(qlikName.toLowerCase());
          });
          console.log('Focusing on', focusMeshes.length, 'selected parts');
        } else {
          focusMeshes = meshes.filter(m => m.visible);
        }

        if (focusMeshes.length === 0) {
          console.log('No meshes to focus on');
          return;
        }

        const visible = focusMeshes;

        const box = new THREE.Box3();
        visible.forEach(m => {
          m.geometry.computeBoundingBox();
          const b = m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld);
          box.union(b);
        });

        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        // Get actual viewport dimensions
        const container = document.getElementById('container');
        const aspect = container.clientWidth / container.clientHeight;

        // Calculate distance needed to fit both width and height
        const fovRad = (camera.fov * Math.PI / 180);
        const halfFovY = fovRad / 2;
        const halfFovX = Math.atan(Math.tan(halfFovY) * aspect);

        // Distance needed to fit height
        const distY = (size.y / 2) / Math.tan(halfFovY);
        // Distance needed to fit width
        const distX = (size.x / 2) / Math.tan(halfFovX);

        // Use the larger distance to ensure everything fits, add 10% padding
        const dist = Math.max(distX, distY, size.z) * 1.1;

        console.log('Focusing on', visible.length, 'parts, size:', size.x.toFixed(2), 'x', size.y.toFixed(2), 'x', size.z.toFixed(2), 'dist:', dist.toFixed(3), 'aspect:', aspect.toFixed(2));

        const target = new THREE.Vector3(center.x, center.y, center.z + dist);
        const start = camera.position.clone();
        const startTarget = controls.target.clone();
        const startTime = Date.now();

        function animate() {
          const t = Math.min((Date.now() - startTime) / 500, 1);
          const ease = t * (2 - t);
          camera.position.lerpVectors(start, target, ease);
          controls.target.lerpVectors(startTarget, center, ease);
          controls.update();
          if (t < 1) requestAnimationFrame(animate);
        }
        animate();
      });
    }

    loadAtlas().then(initScene).catch(err => {
      console.error('Fatal:', err);
      document.getElementById('loading').innerHTML = `<h3 style="color:#ff6b6b;">Error: ${err.message}</h3>`;
    });
  </script>
